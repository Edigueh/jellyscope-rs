<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jellyscope</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Jellyscope</h1>
      <span class="sub">JWST jellyfish galaxy datacubes</span>
    </header>

    <div id="layout">
      <aside id="controls">
        <label>Dataset<select id="dataset"></select></label>
        <label>Datacube<select id="cube"></select></label>

        <fieldset>
          <legend>View</legend>
          <label><input type="radio" name="mode" value="single" checked /> Single filter</label>
          <label><input type="radio" name="mode" value="rgb" /> RGB composite</label>
        </fieldset>

        <div id="single-controls">
          <label>Filter
            <input type="range" id="filter" min="0" max="0" step="1" value="0" />
            <span id="filter-label"></span>
          </label>
          <label>Stretch
            <select id="stretch">
              <option value="asinh">asinh</option>
              <option value="log">log</option>
            </select>
          </label>
          <label>Colors
            <select id="colorscale">
              <option value="1" selected>Viridis</option>
              <option value="2">Inferno</option>
              <option value="3">Plasma</option>
              <option value="4">Cividis</option>
              <option value="5">Hot</option>
              <option value="6">Greys</option>
            </select>
          </label>
        </div>

        <div id="rgb-controls" hidden>
          <label>R<select id="rgb-r"></select></label>
          <label>G<select id="rgb-g"></select></label>
          <label>B<select id="rgb-b"></select></label>
          <label>Recipe
            <select id="rgb-method">
              <option value="percentile">percentile-asinh</option>
              <option value="lupton">Lupton</option>
            </select>
          </label>
          <label id="rgb-q-wrap" hidden>Q
            <input type="range" id="rgb-q" min="1" max="30" step="0.5" value="8" />
            <span id="rgb-q-label">8.0</span>
          </label>
        </div>

        <label><input type="checkbox" id="boundaries" checked /> Clump boundaries</label>

        <div id="panel">
          <h2>Clump</h2>
          <p id="panel-empty">Click a clump to inspect it.</p>
          <dl id="panel-props" hidden></dl>
        </div>

        <p id="readout"></p>
      </aside>

      <main>
        <canvas id="view"></canvas>
      </main>
    </div>

    <script type="module" src="glue.js"></script>
  </body>
</html>
