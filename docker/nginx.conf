# jellyscope-rs static server. Root holds web/ and dist/ as siblings so the
# viewer's absolute /dist fetches and /web/index.html both resolve.
server {
    listen 80;
    server_name _;
    root /srv;

    # Emit relative Location headers so the redirect keeps the client's
    # host:port (nginx listens on 80 internally, mapped to 8000 on the host).
    absolute_redirect off;

    # Land on the viewer.
    location = / {
        return 302 /web/index.html;
    }

    # App shell (JS/WASM/HTML): always revalidate so a rebuilt image is picked
    # up on reload. ETag keeps unchanged files a cheap 304.
    location /web/ {
        add_header Cache-Control "no-cache";
    }

    # .f32/.i32 assets have no registered type; serve as raw bytes. Revalidate
    # on every load so a re-baked dist (new datasets, updated clumps) is picked
    # up without needing a hard reload.
    location /dist/ {
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }
}
